<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HectorAJM</title>

    <!-- Meta Tags para Previsualización (WhatsApp, Discord, Twitter, etc) -->
    <meta name="description" content="Personal Portfolio & Secure Infrastructure Portal by HectorAJM." />
    
    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hectorajm.dpdns.org/" />
    <meta property="og:title" content="HectorAJM | Portfolio & Portal" />
    <meta property="og:description" content="Personal Portfolio & Secure Infrastructure Portal by HectorAJM." />
    <meta property="og:image" content="https://hectorajm.dpdns.org/preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://hectorajm.dpdns.org/" />
    <meta property="twitter:title" content="HectorAJM | Portfolio & Portal" />
    <meta property="twitter:description" content="Personal Portfolio & Secure Infrastructure Portal by HectorAJM." />
    <meta property="twitter:image" content="https://hectorajm.dpdns.org/preview.png" />

    <!-- NUEVO: fuentes con preconnect (antes se cargaban con @import en CSS y bloqueaban el render) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- NUEVO: color de tema + manifest (instalable) -->
    <meta name="theme-color" content="#020617" />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="/site.webmanifest" />
  </head>
